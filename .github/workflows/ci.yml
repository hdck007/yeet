name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Unit tests + the install/uninstall suite ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go tests
        run: CGO_ENABLED=1 go test ./...

      - name: Install jq and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck

      - name: Shell syntax (bash)
        run: |
          for f in install.sh uninstall.sh scripts/*.sh hooks/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || exit 1
          done

      - name: Shellcheck
        run: shellcheck -S error install.sh uninstall.sh scripts/test-install.sh scripts/bench-offline.sh scripts/bench-verbs.sh

      - name: Install/uninstall test suite
        run: NO_COLOR=1 bash scripts/test-install.sh

      - name: Offline benchmark (smoke)
        run: NO_COLOR=1 bash scripts/bench-offline.sh --quiet

      # The rewrite hook decides what reaches the model and what skips the
      # permission prompt, so both halves are gated here: the proxy suite pins
      # every rewrite it produces, and bench-verbs exits non-zero if any
      # command from the must-not-rewrite corpus leaks through.
      - name: Build yeet for the hook suite
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/yeet" ./cmd/yeet
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Proxy hook rewrite suite
        run: NO_COLOR=1 bash hooks/test-yeet-proxy.sh

      - name: Verb benchmark and must-not-rewrite corpus
        run: NO_COLOR=1 bash scripts/bench-verbs.sh --yeet "$RUNNER_TEMP/bin/yeet"

  # ── Linux release binaries (CGO, so they cannot be cross-built on macOS) ─────
  build-linux:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cross toolchain for arm64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build
        run: |
          VERSION=$(cat VERSION)
          LD="-X github.com/hdck007/yeet/internal/cli.Version=$VERSION"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags "$LD" -o dist/yeet-linux-amd64 ./cmd/yeet/
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags "$LD" -o dist/yeet-linux-arm64 ./cmd/yeet/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/yeet-linux-*
          retention-days: 1

  # ── Tag + release ───────────────────────────────────────────────────────────
  release:
    runs-on: macos-15
    needs: [test, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Extract version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      # A push that does not bump VERSION is normal (docs, scripts, tests) and
      # must not fail the build — skip the release instead.
      - name: Does this version already have a tag?
        id: tagcheck
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$VERSION$"; then
            echo "Tag $VERSION already exists — skipping the release."
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

      - name: Build macOS binaries
        if: steps.tagcheck.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LD="-X github.com/hdck007/yeet/internal/cli.Version=$VERSION"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "$LD" -o dist/yeet-darwin-amd64 ./cmd/yeet/
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "$LD" -o dist/yeet-darwin-arm64 ./cmd/yeet/
          lipo -create -output dist/yeet-darwin-universal dist/yeet-darwin-amd64 dist/yeet-darwin-arm64

      - name: Fetch the Linux binaries
        if: steps.tagcheck.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist

      - name: Every advertised asset must exist
        if: steps.tagcheck.outputs.release == 'true'
        run: |
          # install.sh downloads these exact names — a missing one breaks installs
          # on that platform, so fail here rather than after publishing.
          for a in yeet-darwin-universal yeet-linux-amd64 yeet-linux-arm64; do
            [ -s "dist/$a" ] || { echo "Missing release asset: $a"; exit 1; }
          done
          ls -la dist

      - name: Tag
        if: steps.tagcheck.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
